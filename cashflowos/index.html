<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CashFlowOS — Receivables Intelligence</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-size:24px;font-weight:800}.brand span{color:#2563eb}.sub{color:#667085;font-size:13px;margin-top:4px}.btn{border:0;border-radius:10px;padding:10px 15px;background:#172033;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid #e6eaf0;border-radius:14px;padding:18px;box-shadow:0 2px 8px #10182808}.label{color:#667085;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.value{font-size:26px;font-weight:800;margin-top:8px}.danger{color:#d92d20}.warn{color:#b54708}.good{color:#027a48}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}.table{width:100%;border-collapse:collapse;background:white;border:1px solid #e6eaf0;border-radius:14px;overflow:hidden}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #eef1f5;font-size:13px}.table th{background:#f8fafc;color:#667085;font-size:11px;text-transform:uppercase}.pill{padding:4px 8px;border-radius:999px;font-weight:700;font-size:11px}.high{background:#fee4e2;color:#b42318}.medium{background:#fef0c7;color:#93370d}.low{background:#dcfae6;color:#067647}.actions{display:flex;gap:8px}.small{padding:7px 9px;border:1px solid #d0d5dd;background:white;border-radius:8px;cursor:pointer;font-weight:600}.insight{display:grid;grid-template-columns:2fr 1fr;gap:14px}.hero{background:#172033;color:white;border-radius:14px;padding:22px}.hero .big{font-size:32px;font-weight:800}.hero p{color:#cbd5e1}.list{margin:0;padding-left:18px}.list li{margin:10px 0}.empty{color:#667085;text-align:center;padding:25px}@media(max-width:800px){.grid,.insight{grid-template-columns:1fr 1fr}.table{display:block;overflow:auto}}@media(max-width:520px){.shell{padding:16px}.grid,.insight{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><div class="brand">CashFlow<span>OS</span></div><div class="sub">Receivables intelligence for B2B businesses</div></div><button class="btn" onclick="alert('CSV import is the next MVP workflow.')">Import CSV</button></header>
<section class="grid">
<div class="card"><div class="label">Outstanding</div><div class="value" id="outstanding">—</div></div>
<div class="card"><div class="label">Overdue</div><div class="value danger" id="overdue">—</div></div>
<div class="card"><div class="label">Due today</div><div class="value warn" id="today">—</div></div>
<div class="card"><div class="label">High-risk customers</div><div class="value danger" id="risk">—</div></div>
</section>
<section class="section insight"><div class="hero"><div class="label" style="color:#cbd5e1">AI collection opportunity</div><div class="big" id="opportunity">—</div><p id="opportunityText">Analyzing receivables…</p></div><div class="card"><div class="label">Today's priorities</div><ol class="list" id="priorities"></ol></div></section>
<section class="section"><h2>Collection queue</h2><table class="table"><thead><tr><th>Customer</th><th>Invoice</th><th>Balance</th><th>Days overdue</th><th>Risk</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section>
</div>
<script>
const invoices=[
['Ravi Traders','INV-1001','2026-07-10',185000,0],['Sri Lakshmi Stores','INV-1002','2026-08-19',72000,0],['Kumar Agencies','INV-1003','2026-08-15',34000,10000],['Metro Electricals','INV-1004','2026-08-04',125000,50000],['Shree Building Materials','INV-1005','2026-07-15',240000,0],['Anu Enterprises','INV-1006','2026-08-20',58000,58000],['Vijaya Hardware','INV-1007','2026-08-24',96000,0],['Krishna Distributors','INV-1008','2026-07-31',310000,150000],['Star Agencies','INV-1009','2026-09-09',88000,0],['Navya Traders','INV-1010','2026-08-11',145000,0]
];
const today=new Date('2026-08-24T00:00:00');
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
const data=invoices.map(x=>{const bal=x[3]-x[4],due=new Date(x[2]+'T00:00:00'),days=Math.max(0,Math.floor((today-due)/86400000));let risk=days>=30||bal>=180000?'High':days>=7||bal>=100000?'Medium':'Low';return {name:x[0],inv:x[1],bal,days,due,risk}}).filter(x=>x.bal>0).sort((a,b)=>b.bal*b.days-a.bal*a.days);
const outstanding=data.reduce((s,x)=>s+x.bal,0),overdue=data.filter(x=>x.days>0).reduce((s,x)=>s+x.bal,0),dueToday=data.filter(x=>x.days===0).reduce((s,x)=>s+x.bal,0),high=data.filter(x=>x.risk==='High').length;
document.getElementById('outstanding').textContent=money(outstanding);document.getElementById('overdue').textContent=money(overdue);document.getElementById('today').textContent=money(dueToday);document.getElementById('risk').textContent=high;
const opp=data.filter(x=>x.days>=7).slice(0,5).reduce((s,x)=>s+x.bal,0);document.getElementById('opportunity').textContent=money(opp);document.getElementById('opportunityText').textContent='Top overdue balances with meaningful aging, prioritized for collection this week.';
document.getElementById('priorities').innerHTML=data.slice(0,4).map(x=>`<li><strong>${x.name}</strong><br>${money(x.bal)} · ${x.days?x.days+' days overdue':'due today'}</li>`).join('');
document.getElementById('rows').innerHTML=data.map(x=>`<tr><td><strong>${x.name}</strong></td><td>${x.inv}</td><td><strong>${money(x.bal)}</strong></td><td>${x.days}</td><td><span class="pill ${x.risk.toLowerCase()}">${x.risk}</span></td><td><div class="actions"><button class="small" onclick="message('${x.name}',${x.bal})">Draft follow-up</button></div></td></tr>`).join('');
function message(name,balance){alert(`Follow-up draft for ${name}:\n\nHi ${name}, this is a friendly reminder that ${money(balance)} remains outstanding. Could you please confirm the expected payment date?`)}
</script>
</body></html>
